name: core-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag, audited 2026-08-19
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 tag, audited 2026-08-19
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,notebooks]"
      - run: python scripts/quality_gate.py

  research-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag, audited 2026-08-19
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 tag, audited 2026-08-19
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,research]"
      - run: python -c "import accelerate, datasets, peft, transformers; print(transformers.__version__)"
      - run: python -m pytest -q tests/test_research_gates.py
