name: nightly-course-audit

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebooks-and-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 tag, audited 2026-08-19
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5 tag, audited 2026-08-19
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,notebooks]"
      - run: jupyter nbconvert --to notebook --execute --inplace notebooks/ko/*.ipynb --ExecutePreprocessor.timeout=180
      - run: jupyter nbconvert --to notebook --execute --inplace notebooks/en/*.ipynb --ExecutePreprocessor.timeout=180
      - run: python scripts/check_notebooks.py --require-executed
      - run: python scripts/check_colab.py
      - run: python scripts/check_links.py
      - run: python scripts/literature_snapshot.py
      - name: Upload fresh literature snapshot for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 tag, audited 2026-08-19
        with:
          name: literature-snapshot
          path: docs/research/literature-snapshot.json
